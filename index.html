<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révisions LFO">
<title>LFO - Gilles Daram - Révisions partie 1 (trimestre 1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1b2333; --muted:#5b6578; --line:#e3e7f0;
  --blue:#2563eb; --blue-soft:#e8efff; --orange:#ea6a0c; --orange-soft:#fff1e6;
  --green:#15935b; --green-soft:#e5f6ee; --red:#d23b3b; --red-soft:#fdeaea;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px)}
header.top{display:flex;align-items:center;gap:10px;margin:6px 0 16px}
header.top h1{font-size:1.35rem;margin:0;font-weight:800;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:.85rem;margin:0}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;padding:6px 0;margin-bottom:4px}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:0 1px 2px rgba(20,30,60,.06),0 4px 14px rgba(20,30,60,.05);margin-bottom:12px}
.progress-card{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff}
.progress-card .big{font-size:1.6rem;font-weight:800}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s}
.section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800;margin:20px 4px 8px}
.fiche-item{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.fiche-item .ico{font-size:1.6rem;width:48px;height:48px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;flex:none}
.fiche-item .t{font-weight:800;line-height:1.25}
.fiche-item .m{font-size:.82rem;color:var(--muted)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--blue-soft);color:var(--blue);margin-right:6px}
.badge.ok{background:var(--green-soft);color:var(--green)}
.badge.ac{background:#f1effc;color:#5b44c4}
.chev{margin-left:auto;color:#a3abbd;font-size:1.3rem}
.note{font-size:.8rem;color:var(--muted);text-align:center;margin:18px 8px}
/* Fiche */
.fiche h2{font-size:1.3rem;margin:4px 0 4px;line-height:1.25}
.fiche h3{font-size:1.05rem;margin:0 0 6px;color:var(--blue)}
.fiche p{margin:0 0 8px}
.fiche ul{margin:0 0 8px;padding-left:20px}
.fiche li{margin-bottom:4px}
.retenir{background:var(--orange-soft);border-left:5px solid var(--orange)}
.retenir h3{color:var(--orange)}
.kw{font-weight:800;color:var(--blue)}
.def{border-top:1px solid var(--line);padding:10px 0}
.def:first-of-type{border-top:none}
.def b{display:block}
.ipbig{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.5rem;font-weight:800;text-align:center;margin:8px 0 2px;letter-spacing:.02em}
.ipmask{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:center;color:var(--muted);font-weight:700}
.net{color:var(--blue)} .host{color:var(--orange)}
.legend{display:flex;justify-content:center;gap:14px;font-size:.82rem;margin-top:6px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
table.rt{width:100%;border-collapse:collapse;font-size:.88rem;margin:6px 0}
table.rt th,table.rt td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.rt th{background:var(--blue-soft)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;justify-content:center;margin:8px 0}
.flow span{background:var(--blue-soft);color:var(--blue);font-weight:700;border-radius:10px;padding:6px 10px;font-size:.85rem}
.flow em{font-style:normal;color:#9aa3b5}
svg.schema{width:100%;height:auto;display:block}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:800;text-align:center;background:var(--blue);color:#fff;margin-top:10px}
.btn.sec{background:var(--blue-soft);color:var(--blue)}
.btn.ok{background:var(--green)}
.btn.ghost{background:transparent;color:var(--muted)}
.row{display:flex;gap:10px}.row>*{flex:1}
/* Flashcards */
.flash-wrap{perspective:1200px;margin:8px 0}
.flash{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 6px 24px rgba(20,30,60,.10)}
.face.front{background:#fff}
.face.back{background:var(--blue);color:#fff;transform:rotateY(180deg)}
.face .lab{position:absolute;top:14px;left:16px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;opacity:.6}
.face .txt{font-size:1.2rem;font-weight:700;line-height:1.4}
.face .hint{position:absolute;bottom:14px;font-size:.78rem;opacity:.55}
.counter{text-align:center;color:var(--muted);font-weight:700;font-size:.9rem}
/* Quiz */
.q{font-size:1.1rem;font-weight:800;margin:4px 0 12px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;margin-bottom:8px;font-weight:600}
.opt.good{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.expl{border-radius:12px;padding:12px 14px;margin-top:4px;font-size:.92rem}
.expl.g{background:var(--green-soft)} .expl.b{background:var(--red-soft)}
.qbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.qbar>i{display:block;height:100%;background:var(--blue);transition:width .3s}
.score{text-align:center;font-size:3rem;font-weight:800;color:var(--blue);margin:10px 0 0}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:#8a93a6;padding:6px 0}
nav.tabs button .i{font-size:1.35rem;line-height:1}
nav.tabs button.on{color:var(--blue)}

/* ===== Charte « pastels vifs » ===== */
:root{--bg:#fbf8f3;--ink:#1d2135;--muted:#5d6275;--line:#ece6dc;--acc:#3eb3a6;--soft:#dcf3f0;--deep:#1d7c71}
html,body{background:#fbf8f3;color:#1d2135}
h1,h2,h3,.big,.score,.q,.fiche-item .t{font-family:"Baloo 2",Nunito,sans-serif}
header.top{flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:18px}
.logo{display:grid;grid-template-columns:repeat(3,9px);gap:4px;margin-bottom:6px}
.logo i{width:9px;height:9px;border-radius:50%;display:block}
header.top h1{font-size:2.7rem;line-height:1;font-weight:700;color:#1d2135;letter-spacing:.01em}
.rainbow{height:6px;width:70%;max-width:330px;border-radius:99px;background:linear-gradient(90deg,#f4a08a,#f6c56b,#a9d98a,#7fcfc4,#8fb4ee,#b59ce8,#ee9ccb);margin:10px 0 8px}
header.top .sub{color:#1d2135;font-weight:700;font-size:.95rem;margin:0}
header.top .sub2{color:var(--muted);font-size:.85rem;margin:0}
.back{color:var(--deep)}
.section-title{color:#3a3f55;letter-spacing:.12em}
.note,.counter{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);box-shadow:none;border-radius:18px}
.progress-card{background:#fff;color:#1d2135}
.progress-card .bar{background:#f0ebe2}
.progress-card .bar>i{background:linear-gradient(90deg,#f4a08a,#f6c56b,#a9d98a,#7fcfc4,#8fb4ee,#b59ce8,#ee9ccb)}
.fiche-item{background:var(--acc);border:none;color:#fff}
.fiche-item .ico{background:rgba(255,255,255,.28)}
.fiche-item .t{color:#fff;font-size:1.15rem;font-weight:600}
.fiche-item .m{color:rgba(255,255,255,.93)}
.chev{color:#fff}
.fiche-item.rb .t,.fiche-item.rb .m,.fiche-item.rb .chev{color:#1d2135}
.badge{background:var(--soft);color:var(--deep)}
.fiche-item .badge{background:#fff}
.badge.ok{background:#e5f6ee;color:#15935b}
.fiche h3,.kw{color:var(--deep)}
.fiche .card:first-child{background:var(--acc);color:#fff;border:none}
.fiche .card:first-child .badge{background:#fff}
.retenir{background:var(--soft);border:none;border-left:6px solid var(--acc)}
.retenir h3{color:var(--deep)}
.btn{background:var(--acc);color:#fff}
.btn.sec{background:var(--soft);color:var(--deep)}
.btn.ok{background:#1d2135}
.btn.ghost{background:transparent;color:var(--muted)}
.face.front{background:var(--soft);color:#1d2135}
.face.back{background:var(--acc);color:#fff}
.qbar{background:#ece6dc}
.qbar>i{background:var(--acc)}
.score{color:var(--deep)}
nav.tabs{background:rgba(251,248,243,.96);border-top:1px solid var(--line)}
nav.tabs button{color:#8a8ea0;border-radius:99px}
nav.tabs button.on{color:#fff;background:#1d2135}
.fiche h2,.big,.score,.q{font-weight:700}
.fiche h3{font-weight:600}
/* Convertisseur binaire */
.conv .grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;text-align:center}
.conv .w{font-size:.72rem;color:var(--muted);font-weight:800}
.conv .bit{padding:10px 0;border-radius:10px;background:#f3efe8;font-weight:800;font-size:1.25rem;font-family:ui-monospace,Menlo,monospace}
.conv .bit.on{background:var(--acc);color:#fff}
.conv .dec{text-align:center;font-size:1.8rem;font-weight:700;color:var(--deep);font-family:"Baloo 2",Nunito,sans-serif;margin-top:8px}
.conv .sum{text-align:center;font-size:.88rem;color:var(--muted);min-height:1.3em}
.conv input[type=range]{width:100%;accent-color:var(--acc);margin-top:8px}
</style>
</head>

<script>
/* ===================== CONTENU ===================== */
const SCHEMA_RESEAU = `
<svg class="schema" viewBox="0 0 340 240" role="img" aria-label="Schéma du réseau d'un collège">
 <defs><style>.b{fill:#e8efff;stroke:#2563eb;stroke-width:1.5}.t{font:700 11px Nunito,sans-serif;fill:#1b2333;text-anchor:middle}.w{stroke:#5b6578;stroke-width:2}.d{stroke:#ea6a0c;stroke-width:2;stroke-dasharray:4 4}.c{fill:#fff1e6;stroke:#ea6a0c;stroke-width:1.5}</style></defs>
 <ellipse class="c" cx="170" cy="28" rx="62" ry="20"/><text class="t" x="170" y="32">Internet 🌍</text>

 <line class="w" x1="170" y1="98" x2="170" y2="120"/>
 <rect class="b" x="120" y="120" width="100" height="28" rx="7"/><text class="t" x="170" y="138">Commutateur</text>
 <rect class="b" x="8" y="120" width="82" height="28" rx="7"/><text class="t" x="49" y="138">Serveur</text>
 <line class="w" x1="90" y1="134" x2="120" y2="134"/>
 <rect class="b" x="250" y="120" width="82" height="28" rx="7"/><text class="t" x="291" y="138">Borne Wi-Fi</text>
 <line class="w" x1="220" y1="134" x2="250" y2="134"/>
 <line class="w" x1="145" y1="148" x2="50" y2="185"/>
 <line class="w" x1="165" y1="148" x2="135" y2="185"/>
 <line class="w" x1="185" y1="148" x2="220" y2="185"/>
 <rect class="b" x="15" y="185" width="70" height="26" rx="7"/><text class="t" x="50" y="202">Ordinateur</text>
 <rect class="b" x="100" y="185" width="70" height="26" rx="7"/><text class="t" x="135" y="202">Ordinateur</text>
 <rect class="b" x="185" y="185" width="70" height="26" rx="7"/><text class="t" x="220" y="202">Imprimante</text>
 <line class="d" x1="295" y1="148" x2="300" y2="185"/>
 <rect class="b" x="265" y="185" width="70" height="26" rx="7"/><text class="t" x="300" y="202">Tablette</text>
 <line class="w" x1="70" y1="230" x2="95" y2="230"/><text class="t" x="125" y="234">filaire</text>
 <line class="d" x1="180" y1="230" x2="205" y2="230"/><text class="t" x="240" y="234">sans fil</text>
</svg>`;

const FICHES = [
{
 id:"sfc1n", acc:"#ef8a72", soft:"#fde7e0", deep:"#b9523b", chap:"Réseaux informatiques", code:"SFC1n", ico:"🌍",
 titre:"Réseau local et réseau mondial (Internet)",
 resume:"LAN, Internet, FAI, Internet ≠ Web",
 sections:[
  {h:"Qu'est-ce qu'un réseau informatique ?", html:`<p>Un <span class="kw">réseau informatique</span> est un ensemble d'appareils reliés entre eux pour <b>échanger des données</b>, <b>partager des ressources</b> (fichiers, imprimante, connexion Internet) et <b>communiquer</b>.</p>`},
  {h:"Le réseau local (LAN)", html:`<p>Un <span class="kw">réseau local</span> relie des appareils situés dans un <b>même lieu</b> : la maison, le collège, une entreprise.</p>
   <ul><li>Au collège : ordinateurs, imprimantes, serveur et bornes Wi-Fi forment le réseau pédagogique. On s'y connecte avec un <b>identifiant</b> et un <b>mot de passe</b>.</li>
   <li>À la maison : c'est la <b>box</b> qui crée le réseau local (Wi-Fi et prises Ethernet).</li></ul>`},
  {h:"Internet, le « réseau des réseaux »", html:`<p><span class="kw">Internet</span> est un réseau <b>mondial</b> qui relie entre eux des millions de réseaux locaux et des milliards d'appareils.</p>
   <ul><li>Les données voyagent par des câbles (dont des <b>câbles sous-marins en fibre optique</b> entre les continents), des antennes et des satellites.</li>
   <li>Pour y accéder, on passe par un <span class="kw">FAI</span> (Fournisseur d'Accès à Internet), qui relie la box à Internet.</li></ul>`},
  {h:"Internet et le Web, ce n'est pas pareil", html:`<p>Le <span class="kw">Web</span> (les sites et les pages reliés par des liens) n'est qu'<b>un des services</b> d'Internet. Il en existe d'autres : messagerie, visioconférence, jeux en ligne, streaming…</p>`},
  {h:"À quoi servent les réseaux ?", html:`<ul><li><b>Communiquer</b> : messagerie, appels vidéo</li><li><b>Partager</b> : fichiers, musique, vidéos</li><li><b>Apprendre</b> : recherches, ENT, cours à distance</li><li><b>Se divertir</b> : jeux en ligne, films, séries</li></ul>`}
 ],
 retenir:[
  "Un réseau local (LAN) relie les appareils d'un même lieu (maison, collège).",
  "Internet est le réseau mondial qui relie entre eux les réseaux locaux.",
  "On accède à Internet grâce à un FAI, via la box.",
  "Le Web est un service d'Internet, pas Internet lui-même."
 ],
 cartes:[
  {q:"Qu'est-ce qu'un réseau informatique ?", r:"Un ensemble d'appareils reliés entre eux pour échanger des données, partager des ressources et communiquer."},
  {q:"Qu'est-ce qu'un réseau local (LAN) ?", r:"Un réseau qui relie les appareils d'un même lieu : maison, collège, entreprise."},
  {q:"Qu'est-ce qu'Internet ?", r:"Le réseau mondial qui relie entre eux des millions de réseaux locaux."},
  {q:"Pourquoi appelle-t-on Internet « le réseau des réseaux » ?", r:"Parce qu'il interconnecte les réseaux du monde entier."},
  {q:"Que signifie FAI ?", r:"Fournisseur d'Accès à Internet : l'entreprise qui relie ta box à Internet."},
  {q:"Internet et le Web, c'est la même chose ?", r:"Non ! Le Web (sites et pages) est un des services d'Internet, comme la messagerie ou la visio."},
  {q:"Quel appareil relie le réseau de la maison à Internet ?", r:"La box (un modem-routeur)."},
  {q:"Comment les données traversent-elles les océans ?", r:"Principalement par des câbles sous-marins en fibre optique."}
 ],
 quiz:[
  {q:"Un réseau local, c'est…", c:["Un réseau limité à un même lieu (maison, collège)","Le réseau mondial","Un site web","Un câble sous-marin"], ok:0, e:"Le réseau local (LAN) relie les appareils d'un même lieu."},
  {q:"Internet est…", c:["Un réseau mondial qui relie des millions de réseaux","Un logiciel pour naviguer","Le réseau du collège","Une box"], ok:0, e:"Internet est le « réseau des réseaux » à l'échelle de la planète."},
  {q:"Qui relie ta box à Internet ?", c:["Le FAI (Fournisseur d'Accès à Internet)","Le commutateur","L'imprimante","Le navigateur"], ok:0, e:"Le FAI fournit l'accès à Internet et une adresse IP publique à la box."},
  {q:"Le Web est…", c:["Un des services d'Internet","Un autre nom d'Internet","Un câble réseau","Un réseau local"], ok:0, e:"Le Web (sites et pages) fonctionne grâce à Internet, comme la messagerie ou la visio."},
  {q:"Lequel de ces services N'est PAS le Web ?", c:["La messagerie électronique","Un site d'actualités","Une page Wikipédia","Le site du collège"], ok:0, e:"La messagerie est un service d'Internet distinct du Web."},
  {q:"Entre les continents, les données passent surtout par…", c:["Des câbles sous-marins en fibre optique","Le Bluetooth","Des clés USB","Le Wi-Fi"], ok:0, e:"La grande majorité du trafic intercontinental passe par la fibre optique sous-marine."}
 ]
},
{
 id:"sfc1o", acc:"#3eb3a6", soft:"#dcf3f0", deep:"#1d7c71", chap:"Réseaux informatiques", code:"SFC1o", ico:"🖧",
 titre:"Les composants d'un réseau",
 resume:"Terminal, carte réseau, liaisons, commutateur, routeur, serveur",
 sections:[
  {h:"Schéma du réseau d'un collège", html:SCHEMA_RESEAU},
  {h:"Le rôle de chaque composant", html:`
   <div class="def"><b>💻 Terminal</b>Appareil de l'utilisateur, au bout du réseau : ordinateur, tablette, smartphone, imprimante, objet connecté. Il envoie et reçoit des données.</div>
   <div class="def"><b>🔌 Carte réseau</b>Composant qui permet à un appareil de se connecter au réseau (prise RJ45 ou antenne Wi-Fi). Chaque carte possède une adresse physique unique : l'<span class="kw">adresse MAC</span>.</div>
   <div class="def"><b>🔀 Commutateur (switch)</b>Boîtier à plusieurs prises qui relie les appareils d'un <b>même réseau local</b>. Il envoie les données <b>uniquement</b> vers l'appareil destinataire.</div>
   <div class="def"><b>🧭 Routeur</b>Relie des <b>réseaux différents</b> entre eux (par exemple le réseau du collège et Internet) et choisit le chemin des données.</div>
   <div class="def"><b>🗄️ Serveur</b>Ordinateur, souvent allumé en permanence, qui <b>rend des services</b> aux autres appareils (les <i>clients</i>) : stocker les fichiers des élèves, gérer les comptes, héberger un site, gérer les impressions.</div>
   <div class="def"><b>📶 Borne Wi-Fi (point d'accès)</b>Permet aux appareils sans fil de rejoindre le réseau.</div>`},
  {h:"Les liaisons", html:`<ul>
   <li><b>Filaires</b> : câble Ethernet (paires torsadées, prise RJ45), fibre optique (lumière, très haut débit, longues distances). Stables et rapides.</li>
   <li><b>Non filaires</b> (ondes radio) : Wi-Fi, Bluetooth, 4G/5G. Pratiques pour se déplacer, mais portée limitée et sensibles aux obstacles.</li></ul>`},
  {h:"Astuce mémo", html:`<p>🔀 <b>Commutateur</b> = <b>à l'intérieur</b> d'un réseau.<br>🧭 <b>Routeur</b> = <b>entre</b> les réseaux.<br>📦 La <b>box</b> regroupe modem + routeur + commutateur + borne Wi-Fi.</p>`}
 ],
 retenir:[
  "Le terminal est l'appareil de l'utilisateur ; la carte réseau lui permet de se connecter.",
  "Le commutateur relie les appareils d'un même réseau local.",
  "Le routeur relie des réseaux différents et oriente les données.",

 sections:[
  {h:"À quoi sert une adresse IP ?", html:`<p>Chaque appareil connecté possède une <span class="kw">adresse IP</span> (Internet Protocol) qui l'<b>identifie de façon unique</b> sur le réseau, comme une adresse postale. Les données circulent d'une <b>IP source</b> (expéditeur) vers une <b>IP destination</b> (destinataire).</p>`},
  {h:"Sa structure (IPv4)", html:`<p><b>4 nombres de 0 à 255</b>, séparés par des points. Chaque nombre est codé sur 8 bits (un octet) : 4 × 8 = <b>32 bits</b>.</p>
   <div class="ipbig"><span class="net">192.168.1</span>.<span class="host">25</span></div>
   <div class="ipmask">masque : 255.255.255.0</div>
   <div class="legend"><span><i class="dot" style="background:var(--blue)"></i>partie réseau</span><span><i class="dot" style="background:var(--orange)"></i>partie machine</span></div>
   <p style="margin-top:10px">❌ <b>192.168.1.300</b> n'est pas valide (300 &gt; 255). ❌ <b>10.0.5</b> non plus (seulement 3 nombres).</p>`},
  {h:"Le masque de sous-réseau", html:`<p>Le <span class="kw">masque</span> indique quelle partie de l'adresse désigne le <b>réseau</b> et quelle partie désigne la <b>machine</b>.</p>
   <ul><li>Avec <b>255.255.255.0</b> : les 3 premiers nombres = réseau, le dernier = machine.</li>
   <li>Deux appareils communiquent directement s'ils ont la <b>même partie réseau</b> : 192.168.1.12 et 192.168.1.40 ✅ ; 192.168.1.12 et 192.168.2.12 ❌.</li>
   <li>Dans le réseau 192.168.1.x, les adresses <b>.0</b> (adresse du réseau) et <b>.255</b> (diffusion) sont réservées : il reste <b>254</b> adresses pour les machines.</li>
   <li>Deux appareils d'un même réseau ne peuvent pas avoir la même IP : c'est un <b>conflit d'adresse</b>.</li></ul>`},
  {h:"Commandes utiles", html:`<ul><li><b>ipconfig</b> (Windows) : affiche l'adresse IP de l'ordinateur, son masque et sa passerelle.</li><li><b>ping</b> + adresse IP : vérifie si un appareil répond sur le réseau.</li></ul>`},
  {h:"Et IPv6 ?", html:`<p>IPv4 offre environ 4,3 milliards d'adresses : ce n'est plus suffisant. La nouvelle version, <b>IPv6</b>, utilise 128 bits et s'écrit en hexadécimal (ex. : 2001:db8::1).</p>`}

   <div class="def"><b>🏠 Adresse IP privée</b>Utilisée <b>à l'intérieur d'un réseau local</b> (donnée par la box ou le serveur du collège). Elle ne circule pas directement sur Internet : la même adresse privée existe dans des millions de maisons. Plages privées : <b>192.168.x.x</b>, <b>10.x.x.x</b>, <b>172.16.x.x à 172.31.x.x</b>.</div>

   <li><b>Adresse automatique (dynamique)</b> : attribuée par un <span class="kw">serveur DHCP</span> quand l'appareil se connecte.</li></ul>`},

 id:"bin", acc:"#6ba3e8", soft:"#e2eefc", deep:"#2c67b3", chap:"Données et binaire", code:"SFC1k · SFC1l · OST1i", ico:"💾",
 titre:"Le binaire : bit, octet et conversions",
 resume:"Bit, octet, ko/Mo/Go/To, binaire ↔ décimal, code ASCII",
 sections:[
  {h:"Pourquoi le binaire ?", html:`<p>Un ordinateur est fait de circuits électroniques qui n'ont que <b>deux états</b> : le courant passe ou ne passe pas. On les note <b>1</b> et <b>0</b>.</p><p>Toute information (texte, image, son, vidéo) est transformée en une suite de 0 et de 1 : c'est la <span class="kw">numérisation</span>.</p>`},
  {h:"Le bit et l'octet", html:`<div class="def"><b>🔹 Le bit</b>(de l'anglais <i>binary digit</i>) est la <b>plus petite unité d'information</b> : il vaut 0 ou 1.</div>
   <div class="def"><b>🔷 L'octet</b>est un groupe de <b>8 bits</b>. Il permet 2⁸ = <b>256 combinaisons</b>, donc de coder les nombres de <b>0 à 255</b>.</div>
   <p>Avec n bits, on obtient 2ⁿ combinaisons : 1 bit → 2, 2 bits → 4, 3 bits → 8, 4 bits → 16… 8 bits → 256.</p>
   <p>💡 C'est pour ça que chaque nombre d'une <b>adresse IP</b> va de 0 à 255 : il tient dans un octet !</p>
   <p>⚠️ Symboles : <b>b</b> = bit, <b>o</b> = octet (en anglais <i>byte</i>, noté B).</p>`},
  {h:"Les multiples de l'octet", html:`<table class="rt"><tr><th>Unité</th><th>Vaut</th><th>Exemple</th></tr>
   <tr><td>1 kilooctet (ko)</td><td>1 000 octets</td><td>une page de texte</td></tr>
   <tr><td>1 mégaoctet (Mo)</td><td>1 000 ko</td><td>une photo, une chanson MP3</td></tr>
   <tr><td>1 gigaoctet (Go)</td><td>1 000 Mo</td><td>un film</td></tr>
   <tr><td>1 téraoctet (To)</td><td>1 000 Go</td><td>un disque dur</td></tr></table>
   <p>On passe d'une unité à la suivante en <b>multipliant par 1 000</b>. (On rencontre aussi 1 024 : 1 Kio = 1 024 octets.)</p>`},
  {h:"Binaire → décimal", html:`<p>Chaque position d'un octet a un <b>poids</b>. On <b>additionne les poids des bits à 1</b>.</p>
   <table class="rt" style="text-align:center"><tr><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
   <tr><td>0</td><td><b>1</b></td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>1</b></td></tr></table>
   <p>0100 0001 = 64 + 1 = <b>65</b>. Autre exemple : 1010 = 8 + 2 = <b>10</b>.</p>`},
  {h:"Décimal → binaire", html:`<p><b>Méthode du tableau</b> : on cherche le plus grand poids qui « rentre » dans le nombre, on met 1, on soustrait, et on recommence.</p>
   <p>13 = 8 + 4 + 1 → <b>1101</b></p>
   <p><b>Méthode des divisions par 2</b> : on divise par 2 jusqu'à 0 et on lit les restes <b>de bas en haut</b>.</p>
   <p>13 ÷ 2 = 6 reste <b>1</b> · 6 ÷ 2 = 3 reste <b>0</b> · 3 ÷ 2 = 1 reste <b>1</b> · 1 ÷ 2 = 0 reste <b>1</b> → <b>1101</b></p>`},
  {h:"🧪 À toi de jouer", html:`<p style="font-size:.9rem;color:var(--muted)">Touche les bits pour les allumer, ou bouge le curseur.</p><div class="conv" id="conv"></div>`},
  {h:"Coder autre chose que des nombres", html:`<ul><li><b>Booléen</b> : 1 = vrai, 0 = faux.</li>
   <li><b>Caractères</b> : chaque lettre, chiffre ou symbole a un numéro dans le <span class="kw">code ASCII étendu</span>, stocké sur un octet. Exemple : <b>A</b> = 65 = 0100 0001 ; <b>B</b> = 66 = 0100 0010 ; <b>a</b> = 97.</li></ul>`}
 ],

/* ===================== STOCKAGE ===================== */
const KEY="techno3e-reseaux-v1";
let P={maitrise:{},best:{}};
try{const s=localStorage.getItem(KEY); if(s) P=Object.assign(P,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P));}catch(e){}}

/* ===================== OUTILS ===================== */
const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const byId=id=>FICHES.find(f=>f.id===id);
let tab="home";
const vars=f=>`--acc:${f.acc};--soft:${f.soft};--deep:${f.deep}`;
const setVars=f=>{$app.style.cssText=f?vars(f):"";};
const LOGO=`<div class="logo">${["#f4a08a","#f6c56b","#a9d98a","#7fcfc4","#8fb4ee","#6ba3e8","#b59ce8","#ee9ccb","#e88ab9"].map(c=>`<i style="background:${c}"></i>`).join("")}</div>`;
function setTab(t){tab=t;document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));window.scrollTo(0,0);}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{setTab(b.dataset.tab); if(b.dataset.tab==="home")home(); if(b.dataset.tab==="flash")flashPick(); if(b.dataset.tab==="quiz")quizPick();});

/* ===================== ACCUEIL ===================== */
function home(){
  setTab("home");setVars();
  const n=FICHES.filter(f=>P.maitrise[f.id]).length;
  $app.innerHTML=`
  <header class="top">${LOGO}<h1>TECHNOLOGIE</h1><div class="rainbow"></div><p class="sub">LFO - Gilles Daram - Révisions partie 1 (trimestre 1)</p><p class="sub2">Niveau 3e · Fiches de connaissances</p></header>
  <div class="card progress-card">
    <div style="opacity:.85;font-weight:700;font-size:.85rem">Ma progression</div>
    <div class="big">${n} / ${FICHES.length} fiches maîtrisées</div>
    <div class="bar"><i style="width:${Math.round(n/FICHES.length*100)}%"></i></div>
  </div>
  ${[...new Set(FICHES.map(f=>f.chap))].map(ch=>`<div class="section-title">${ch}</div>`+FICHES.filter(f=>f.chap===ch).map(f=>`
   <button class="card fiche-item" data-id="${f.id}" style="${vars(f)}">
     <span class="ico">${f.ico}</span>
     <span><div><span class="badge">${f.code}</span>${P.maitrise[f.id]?'<span class="badge ok">✓ maîtrisée</span>':''}${P.best[f.id]!=null?`<span class="badge">quiz ${P.best[f.id]}/${f.quiz.length}</span>`:''}</div>
       <div class="t">${esc(f.titre)}</div><div class="m">${esc(f.resume)}</div></span>
     <span class="chev">›</span>
   </button>`).join("")).join("")}
  <p class="note">Programme de technologie du cycle 4 (BO n°9 du 29 février 2024).<br>Contenus élaborés d'après les fiches de connaissances des académies de Bordeaux et de Versailles.</p>`;
  $app.querySelectorAll(".fiche-item").forEach(b=>b.onclick=()=>fiche(b.dataset.id));
}

/* ===================== FICHE ===================== */
function fiche(id){
  setTab("home");
  const f=byId(id);setVars(f);
  $app.innerHTML=`
  <button class="back" id="bk">‹ Fiches</button>
  <div class="fiche">
    <div class="card"><span class="badge">${f.code}</span><h2>${f.ico} ${esc(f.titre)}</h2></div>
    ${f.sections.map(s=>`<div class="card"><h3>${s.h}</h3>${s.html}</div>`).join("")}
    <div class="card retenir"><h3>⭐ Ce que je dois retenir</h3><ul>${f.retenir.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>
  </div>
  <div class="row"><button class="btn sec" id="gf">🃏 Flashcards</button><button class="btn sec" id="gq">✅ Quiz</button></div>
  <button class="btn ${P.maitrise[id]?'ghost':'ok'}" id="mk">${P.maitrise[id]?'Retirer « maîtrisée »':'✓ Je maîtrise cette fiche'}</button>`;
  document.getElementById("bk").onclick=home;
  document.getElementById("gf").onclick=()=>flashStart([id]);
  document.getElementById("gq").onclick=()=>quizStart([id]);
  initConv();
  document.getElementById("mk").onclick=()=>{P.maitrise[id]=!P.maitrise[id];save();fiche(id);};
}


function initConv(){
  const el=document.getElementById("conv"); if(!el) return;
  const W=[128,64,32,16,8,4,2,1]; let v=65;
  el.innerHTML=`<div class="grid">${W.map(w=>`<div class="w">${w}</div>`).join("")}${W.map((w,k)=>`<button class="bit" data-k="${k}">0</button>`).join("")}</div>
   <div class="dec" id="cvd"></div><div class="sum" id="cvs"></div><input type="range" min="0" max="255" id="cvr" aria-label="Nombre décimal">`;
  const bits=el.querySelectorAll(".bit"), r=el.querySelector("#cvr");
  function draw(){
    bits.forEach((b,k)=>{const on=(v&W[k])>0;b.textContent=on?1:0;b.classList.toggle("on",on);});
    const parts=W.filter(w=>v&w);
    el.querySelector("#cvd").textContent=v+" en décimal";
    el.querySelector("#cvs").textContent=parts.length?parts.join(" + ")+" = "+v:"aucun bit allumé = 0";
    r.value=v;
  }
  bits.forEach((b,k)=>b.onclick=()=>{v^=W[k];draw();});
  r.oninput=()=>{v=+r.value;draw();};
  draw();
}

/* ===================== FLASHCARDS ===================== */
function picker(title,sub,onPick){
  setVars();
  $app.innerHTML=`
  <header class="top">${LOGO}<h1>${title}</h1><div class="rainbow"></div><p class="sub2">${sub}</p></header>
  <button class="card fiche-item rb" data-all="1" style="background:linear-gradient(120deg,#fde7e0,#fdf1d6,#e3f4dc,#dcf3f0,#e2eefc,#ece6fb,#fbe5f0)"><span class="ico">🎲</span><span><div class="t">Tout mélanger</div><div class="m">Les ${FICHES.length} fiches</div></span><span class="chev">›</span></button>
  <div class="section-title">Par fiche</div>
  ${FICHES.map(f=>`<button class="card fiche-item" data-id="${f.id}" style="--acc:${f.acc};--soft:${f.soft}"><span class="ico">${f.ico}</span><span><div><span class="badge">${f.code}</span></div><div class="t">${esc(f.titre)}</div></span><span class="chev">›</span></button>`).join("")}`;
  $app.querySelectorAll(".fiche-item").forEach(b=>b.onclick=()=>onPick(b.dataset.all?FICHES.map(f=>f.id):[b.dataset.id]));
}
function flashPick(){setTab("flash");picker("Flashcards","Touche la carte pour voir la réponse",flashStart);}
function flashStart(ids,deck){
  setTab("flash");
  deck=deck||shuffle(ids.flatMap(id=>byId(id).cartes.map(c=>({...c,f:id}))));
  let i=0; const rater=[]; let sues=0;
  function show(){
    if(i>=deck.length) return end();
    const c=deck[i];setVars(byId(c.f));
    $app.innerHTML=`
    <button class="back" id="bk">‹ Flashcards</button>
    <div class="counter">Carte ${i+1} / ${deck.length} · <span class="badge">${byId(c.f).code}</span></div>
    <div class="qbar"><i style="width:${i/deck.length*100}%"></i></div>
    <div class="flash-wrap"><div class="flash" id="fc">
      <div class="face front"><span class="lab">Question</span><div class="txt">${esc(c.q)}</div><span class="hint">Touche pour retourner</span></div>
      <div class="face back"><span class="lab">Réponse</span><div class="txt">${esc(c.r)}</div></div>
    </div></div>
    <div class="row" id="ans" style="visibility:hidden"><button class="btn sec" id="no" style="background:var(--red-soft);color:var(--red)">À revoir</button><button class="btn ok" id="yes">Je savais ✓</button></div>`;
    document.getElementById("bk").onclick=flashPick;
    const fc=document.getElementById("fc");
    fc.onclick=()=>{fc.classList.toggle("flipped");document.getElementById("ans").style.visibility="visible";};
    document.getElementById("yes").onclick=()=>{sues++;i++;show();};
    document.getElementById("no").onclick=()=>{rater.push(c);i++;show();};
  }
  function end(){
    $app.innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:2.5rem">${rater.length?'💪':'🎉'}</div>
      <div class="score">${sues} / ${deck.length}</div>
      <p>${rater.length?`${rater.length} carte(s) à revoir.`:'Toutes les cartes sont sues, bravo !'}</p>
    </div>
    ${rater.length?'<button class="btn" id="again">Revoir les cartes ratées</button>':''}
    <button class="btn sec" id="restart">Recommencer tout le paquet</button>
    <button class="btn ghost" id="bk">Choisir un autre paquet</button>`;
    if(rater.length) document.getElementById("again").onclick=()=>flashStart(null,shuffle(rater));
    document.getElementById("restart").onclick=()=>flashStart(null,shuffle(deck));
    document.getElementById("bk").onclick=flashPick;
  }
  show();
}

/* ===================== QUIZ ===================== */
function quizPick(){setTab("quiz");picker("Quiz","Teste tes connaissances",quizStart);}
function quizStart(ids){
  setTab("quiz");
  const single=ids.length===1?ids[0]:null;
  let qs=ids.flatMap(id=>byId(id).quiz.map(q=>({...q,f:id})));
  qs=shuffle(qs); if(!single) qs=qs.slice(0,12);
  qs=qs.map(q=>({...q,opts:shuffle(q.c.map((t,k)=>({t,good:k===q.ok})))}));
  let i=0,score=0;
  function show(){
    if(i>=qs.length) return end();
    const q=qs[i];setVars(byId(q.f));
    $app.innerHTML=`
    <button class="back" id="bk">‹ Quiz</button>
    <div class="counter">Question ${i+1} / ${qs.length} · <span class="badge">${byId(q.f).code}</span></div>
    <div class="qbar"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="card"><div class="q">${esc(q.q)}</div>
      ${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.t)}</button>`).join("")}
      <div id="fb"></div></div>`;
    document.getElementById("bk").onclick=quizPick;
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=q.opts[+b.dataset.k];
      $app.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true; if(q.opts[k].good) x.classList.add("good");});
      if(o.good) score++; else b.classList.add("bad");
      document.getElementById("fb").innerHTML=`<div class="expl ${o.good?'g':'b'}"><b>${o.good?'Bonne réponse !':'Pas tout à fait.'}</b> ${esc(q.e)}</div>
        <button class="btn" id="nx">${i+1<qs.length?'Question suivante':'Voir mon score'}</button>`;
      document.getElementById("nx").onclick=()=>{i++;show();};
    });
  }
  function end(){
    if(single){P.best[single]=Math.max(P.best[single]??0,score);save();}
    const pct=score/qs.length;
    $app.innerHTML=`
    <div class="card" style="text-align:center">
      <div style="font-size:2.5rem">${pct>=.8?'🏆':pct>=.5?'👍':'📖'}</div>
      <div class="score">${score} / ${qs.length}</div>
      <p>${pct>=.8?'Excellent, tu maîtrises !':pct>=.5?'Pas mal ! Relis la fiche pour consolider.':'Relis la fiche puis réessaie.'}</p>
    </div>
    <button class="btn" id="again">Refaire ce quiz</button>
    ${single?'<button class="btn sec" id="rf">Relire la fiche</button>':''}
    <button class="btn ghost" id="bk">Choisir un autre quiz</button>`;
    document.getElementById("again").onclick=()=>quizStart(ids);
    if(single) document.getElementById("rf").onclick=()=>fiche(single);
    document.getElementById("bk").onclick=quizPick;
  }
  show();
}

home();
